# Lints and tests every pull request to main, when it's opened and on every push to its branch.
# SwiftLint, SwiftFormat and Tests are required status checks on main, so a failure blocks merging.
# Test setup: docs/Leo-Test-Coverage-Plan.md, section 12.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push cancels the run for the previous commit.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Same versions as the local Homebrew installs used by the build phase and pre-commit hook.
  # Bump them together with the checksums of the release zips.
  SWIFTLINT_VERSION: 0.65.1
  SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
  SWIFTFORMAT_VERSION: 0.63.0
  SWIFTFORMAT_SHA256: 28c7802e11fa5ae113d903066439c6bb1be20a8ac1ad9709c42616a7e273fb0f

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # SwiftLint loads SourceKit from the selected Xcode.
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"

      - name: Install SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  swiftformat:
    name: SwiftFormat
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftFormat
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          echo "$SWIFTFORMAT_SHA256  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftformat.zip" swiftformat -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: swiftformat --lint --cache ignore --reporter github-actions-log .

  tests:
    name: Tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      # Build and test in one job from one checkout: snapshot references are found from #filePath.
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-xcode-${{ hashFiles('.xcode-version') }}-${{ hashFiles('Leo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # SNAPSHOT_TESTING_RECORD=never: a missing reference fails the run instead of being recorded.
      # The Leo test plan skips the liveModel tests, so the runner doesn't need Apple Intelligence.
      - name: Test
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild test \
            -project Leo.xcodeproj -scheme Leo -testPlan Leo \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -resultBundlePath build/Leo-tests.xcresult \
            -collect-test-diagnostics never \
            -disableAutomaticPackageResolution \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            SNAPSHOT_TESTING_RECORD=never \
            | xcbeautify --renderer github-actions

      # swift-snapshot-testing writes failing images to the simulator app's tmp folder, not to the
      # result bundle. Copy each one next to the reference it was compared with.
      - name: Collect failing snapshots
        if: failure()
        run: |
          find ~/Library/Developer/CoreSimulator/Devices -path '*/tmp/*SnapshotTests/*.png' -print0 |
            while IFS= read -r -d '' image; do
              suite=$(basename "$(dirname "$image")")
              name=$(basename "$image" .png)
              mkdir -p "build/snapshot-failures/$suite"
              cp "$image" "build/snapshot-failures/$suite/$name.failed.png"
              cp "LeoTestsSnapshots/$suite/$name.png" "build/snapshot-failures/$suite/$name.reference.png" || true
            done

      # Two paths keep the Leo-tests.xcresult folder name in the zip, so Xcode can open it.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Leo-test-results
          path: |
            build/Leo-tests.xcresult
            build/snapshot-failures
          if-no-files-found: ignore
          retention-days: 14

      - name: Coverage summary
        run: |
          xcrun xccov view --report --json build/Leo-tests.xcresult | jq -r '
            def pct: (. * 1000 | round / 10 | tostring) + "%";
            .targets[]
            | "### Coverage: \(.name) \(.lineCoverage | pct)",
              "",
              "\(.coveredLines) of \(.executableLines) executable lines covered.",
              "",
              "<details><summary>Per file, lowest first</summary>",
              "",
              "| File | Coverage | Lines |",
              "|---|---:|---:|",
              (.files | sort_by(.lineCoverage)[] | "| \(.name) | \(.lineCoverage | pct) | \(.coveredLines)/\(.executableLines) |"),
              "",
              "</details>"' >> "$GITHUB_STEP_SUMMARY"
