# Runs the LeoLiveModel test plan (the real on-device model) by hand, from the Actions tab.
# Never runs on pull requests and never blocks a merge. The suites skip themselves when the runner
# doesn't have Apple Intelligence available, which may be the case on hosted runners: check the
# test log for skipped tests before trusting a green run.
name: Live Model Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-model:
    name: Live Model Tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-xcode-${{ hashFiles('.xcode-version') }}-${{ hashFiles('Leo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Test
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild test \
            -project Leo.xcodeproj -scheme Leo -testPlan LeoLiveModel \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -resultBundlePath build/LeoLiveModel-tests.xcresult \
            -collect-test-diagnostics never \
            -disableAutomaticPackageResolution \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: LeoLiveModel-tests-xcresult
          path: build/LeoLiveModel-tests.xcresult
          retention-days: 14
